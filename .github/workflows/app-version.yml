name: App version
on:
  push:
    branches: [main]
    paths-ignore:
      - mobile/version.json
permissions:
  contents: write
concurrency:
  group: app-version-main
  cancel-in-progress: false
jobs:
  increment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Increment version after updates
        env:
          PREVIOUS_REVISION: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "${PREVIOUS_REVISION}:mobile/version.json" 2>/dev/null; then
            echo 'Initial release: v1.0.0.0'
            exit 0
          fi
          git pull --ff-only origin main
          if ! git diff --quiet "$PREVIOUS_REVISION" HEAD -- mobile/version.json; then
            echo 'Version already updated in this release'
            exit 0
          fi
          node --test mobile/scripts/version.test.cjs
          node mobile/scripts/bump-version.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/version.json
          git commit -m 'chore: increment app build version'
          git push origin main
