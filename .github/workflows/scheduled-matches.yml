name: Scheduled matches
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scheduled-matches
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUNBUFFERED: '1'
      MONGODB_CONNECTION_STRING: ${{ secrets.MONGODB_CONNECTION_STRING }}
      MONGODB_DATABASE_NAME: ${{ secrets.MONGODB_DATABASE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate database configuration
        run: |
          test -n "$MONGODB_CONNECTION_STRING" || { echo 'Configure the MONGODB_CONNECTION_STRING repository secret.'; exit 1; }
          test -n "$MONGODB_DATABASE_NAME" || { echo 'Configure the MONGODB_DATABASE_NAME repository secret.'; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Process all overdue matches
        run: |
          git rev-parse --short HEAD
          python -u run_scheduled_matches.py
