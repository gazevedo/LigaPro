name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      MONGODB_CONNECTION_STRING: mongodb://localhost:27017/?directConnection=true
      MONGODB_DATABASE_NAME: ligapro_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Start transactional MongoDB
        run: |
          docker run -d --name ligapro-mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec ligapro-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'; then break; fi
            sleep 1
          done
          docker exec ligapro-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec ligapro-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary ? 1 : quit(1)'; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: |
          export JWT_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          python -c "from app.main import app; assert app.version == '0.1.0'"
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
