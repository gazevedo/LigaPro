[project]
name = "ligapro-api"
version = "0.1.0"
description = "API do jogo de gerenciamento de futebol LigaPro"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pymongo==4.18.2",
    "starlette==1.7.0",
    "argon2-cffi==25.1.0",
    "PyJWT==2.15.1",
    "google-auth[requests]==2.59.1",
    "email-validator==2.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
