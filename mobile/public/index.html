<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#031d30" />
    <meta name="application-name" content="LigaPro" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LigaPro" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <script src="/zoom-lock.js" defer></script>
    <script src="/register-sw.js" defer></script>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background: #fff;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      @media (pointer: coarse) { html, body, #root { touch-action: pan-x pan-y; } }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      Ative o JavaScript para abrir o LigaPro.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"><div style="flex:1;display:flex;align-items:center;justify-content:center;background:#fff"><img src="/brand/logo-ligapro.png" alt="Logotipo LigaPro" style="width:100%;height:auto;aspect-ratio:2;object-fit:contain" /></div></div>
  </body>
</html>
